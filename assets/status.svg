<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 40" width="330" height="40" role="img" aria-label="Disponível para novos projetos">
  <style>
    .f { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; }
    .halo { transform-origin: 24px 20px; animation: ping 2s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .halo { animation: none; opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="329" height="39" rx="19.5" fill="#09090A" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle class="halo" cx="24" cy="20" r="4" fill="#3DDC84"/>
  <circle cx="24" cy="20" r="4" fill="#3DDC84"/>
  <text class="f" x="42" y="24.5" fill="#ECEAE4">Disponível para novos projetos</text>
</svg>
